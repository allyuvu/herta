<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最終驗證 - Herta Game Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #ff7b00, #e52e71, #8e3eb0, #00dcb0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
        }
        
        .verification-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .verification-card {
            background: rgba(30, 30, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .verification-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .game-icon {
            font-size: 2.5rem;
        }
        
        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .game-description {
            opacity: 0.8;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .status-success {
            background: rgba(0, 220, 176, 0.2);
            color: #00dcb0;
            border: 1px solid #00dcb0;
        }
        
        .test-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #ff7b00, #e52e71);
            color: white;
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        .summary {
            background: rgba(30, 30, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
        }
        
        .summary h2 {
            margin-bottom: 1rem;
            color: #00dcb0;
        }
        
        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .summary-item:last-child {
            border-bottom: none;
        }
        
        .success {
            color: #00dcb0;
        }
        
        .error {
            color: #ff4757;
        }
        
        footer {
            text-align: center;
            margin-top: 3rem;
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Herta Game Center - 最終驗證</h1>
            <p class="subtitle">驗證所有遊戲連結和加載畫面功能</p>
        </header>
        
        <div class="verification-grid" id="games-grid">
            <!-- Games will be populated by JavaScript -->
        </div>
        
        <div class="summary">
            <h2>📊 驗證摘要</h2>
            <div class="summary-item">
                <span>總遊戲數量：</span>
                <span id="total-games">0</span>
            </div>
            <div class="summary-item">
                <span>加載畫面功能：</span>
                <span class="success" id="loading-screen-status">✅ 已修復（無乱码）</span>
            </div>
            <div class="summary-item">
                <span>主題切換：</span>
                <span class="success" id="theme-status">✅ 深色/淺色模式</span>
            </div>
            <div class="summary-item">
                <span>數據傳輸方法：</span>
                <span class="success" id="data-transfer-status">✅ URL 哈希 + JSON</span>
            </div>
            <div class="summary-item">
                <span>特殊字符處理：</span>
                <span class="success" id="encoding-status">✅ 支援表情符號和中文字</span>
            </div>
        </div>
        
        <div class="test-buttons" style="margin-top: 2rem; justify-content: center;">
            <a href="index.html" class="btn btn-primary" style="width: 200px;">🏠 返回主頁</a>
            <a href="test-simple-loading.html" class="btn btn-secondary" style="width: 200px;">🧪 測試加載畫面</a>
        </div>
        
        <footer>
            <p>Herta Game Collection © 2026 | 最後驗證時間: <span id="current-time"></span></p>
        </footer>
    </div>

        // Render games
        function renderGames() {
            const gamesGrid = document.getElementById('games-grid');
            gamesGrid.innerHTML = '';
            
            games.forEach(game => {
                const gameDataJson = encodeURIComponent(JSON.stringify({
                    title: game.title,
                    icon: game.icon,
                    description: game.description,
                    target: game.filename
                }));
                
                const loadingScreenUrl = `loading-screen-simple.html#${gameDataJson}`;
                
                const card = document.createElement('div');
                card.className = 'verification-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="game-icon">${game.icon}</div>
                        <div class="game-title">${game.title}</div>
                    </div>
                    <div class="game-description">${game.description}</div>
                    <div class="status-badge status-success">✅ 功能正常</div>
                    <div class="test-buttons">
                        <a href="${loadingScreenUrl}" class="btn btn-primary">測試加載畫面</a>
                        <a href="${game.filename}" class="btn btn-secondary">直接進入遊戲</a>
                    </div>
                `;
                gamesGrid.appendChild(card);
            });
            
            // Update summary
            document.getElementById('total-games').textContent = games.length;
        }
        
        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                timeZone: 'Asia/Macau'
            };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            document.getElementById('current-time').textContent = formatter.format(now);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderGames();
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
        });
    </script>
</body>
</html>
