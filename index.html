                isNew: true,
                isHot: false
            }
        ];

        // Theme management
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        // Check for saved theme or prefer dark mode
        const savedTheme = localStorage.getItem('theme') || 'dark';
        body.classList.add(savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark')) {
                body.classList.replace('dark', 'light');
                localStorage.setItem('theme', 'light');
                updateThemeIcon('light');
            } else {
                body.classList.replace('light', 'dark');
                localStorage.setItem('theme', 'dark');
                updateThemeIcon('dark');
            }
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = 'dark_mode';
                themeIcon.classList.remove('text-orange-500');
                themeIcon.classList.add('text-yellow-300');
            } else {
                themeIcon.textContent = 'light_mode';
                themeIcon.classList.remove('text-yellow-300');
                themeIcon.classList.add('text-orange-500');
            }
        }

        // Sound toggle
        const soundToggle = document.getElementById('sound-toggle');
        let soundEnabled = localStorage.getItem('sound') !== 'false';
        updateSoundIcon();

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            localStorage.setItem('sound', soundEnabled);
            updateSoundIcon();
            // Play a click sound if enabled
            if (soundEnabled) {
                playClickSound();
            }
        });

        function updateSoundIcon() {
            const icon = soundToggle.querySelector('.material-symbols-outlined');
            icon.textContent = soundEnabled ? 'volume_up' : 'volume_off';
        }

        function playClickSound() {
            // Simple click sound using Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // Search and filter functionality
        const searchInput = document.getElementById('search-input');
        const categoryFilters = document.querySelectorAll('.category-filter');
        const gamesGrid = document.getElementById('games-grid');
        
        let currentCategory = 'all';
        let currentSearch = '';

        // Initialize games grid
        renderGames(games);

        // Search functionality
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase();
            filterGames();
        });

        // Category filter functionality
        categoryFilters.forEach(filter => {
            filter.addEventListener('click', () => {
                // Update active state
                categoryFilters.forEach(f => {
                    f.classList.remove('bg-primary', 'text-white', 'shadow-lg', 'shadow-primary/30');
                    f.classList.add('dark:bg-[#2d2d44]', 'light:bg-white', 'dark:text-gray-300', 'light:text-slate-700');
                });
                
                filter.classList.remove('dark:bg-[#2d2d44]', 'light:bg-white', 'dark:text-gray-300', 'light:text-slate-700');
                filter.classList.add('bg-primary', 'text-white', 'shadow-lg', 'shadow-primary/30');
                
                currentCategory = filter.dataset.category;
                filterGames();
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl+K or Cmd+K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
            
            // Escape to clear search
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                currentSearch = '';
                filterGames();
            }
            
            // M to toggle sound
            if (e.key === 'm' || e.key === 'M') {
                soundEnabled = !soundEnabled;
                localStorage.setItem('sound', soundEnabled);
                updateSoundIcon();
            }
            
            // T to toggle theme
            if (e.key === 't' || e.key === 'T') {
                themeToggle.click();
            }
        });

        function filterGames() {
            const filteredGames = games.filter(game => {
                // Search filter
                const matchesSearch = currentSearch === '' || 
                    game.title.toLowerCase().includes(currentSearch) ||
                    game.description.toLowerCase().includes(currentSearch) ||
                    game.tags.some(tag => tag.toLowerCase().includes(currentSearch));
                
                // Category filter
                const matchesCategory = currentCategory === 'all' || 
                    game.categories.includes(currentCategory);
                
                return matchesSearch && matchesCategory;
            });
            
            renderGames(filteredGames);
        }

        function renderGames(gamesToRender) {
            gamesGrid.innerHTML = '';
            
            if (gamesToRender.length === 0) {
                gamesGrid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <span class="material-symbols-outlined !text-[64px] dark:text-gray-600 light:text-slate-300 mb-4">search_off</span>
                        <h3 class="text-xl font-bold dark:text-white light:text-charcoal mb-2">找不到遊戲</h3>
                        <p class="dark:text-text-light light:text-slate-text">嘗試使用不同的搜尋關鍵字或選擇其他分類</p>
                    </div>
                `;
                return;
            }
            
            gamesToRender.forEach(game => {
                const gameElement = document.createElement('div');
                gameElement.className = 'glass-card rounded-2xl p-6 flex flex-col gap-4 relative group cursor-pointer overflow-hidden fade-in';
                gameElement.addEventListener('click', () => {
                    // 跳轉到簡化加載畫面，使用 URL 哈希傳遞遊戲數據
                    const gameData = {
                        title: game.title,
                        icon: game.icon,
                        description: game.description,
                        target: game.filename
                    };
                    const gameDataJson = encodeURIComponent(JSON.stringify(gameData));
                    window.location.href = `loading-screen-simple.html#${gameDataJson}`;
                    if (soundEnabled) playClickSound();
                });
                
                // Highlight effect
                const highlightColor = game.color.startsWith('neon-') ? `var(--${game.color})` : `rgb(var(--${game.color}))`;
                gameElement.innerHTML = `
                    ${game.isNew ? '<div class="game-card-new">NEW ✨</div>' : ''}
                    ${game.isHot && !game.isNew ? '<div class="game-card-hot">HOT 🔥</div>' : ''}
                    
                    <div class="absolute -right-10 -top-10 w-32 h-32 blur-[50px] rounded-full pointer-events-none group-hover:opacity-50 transition-opacity" 
                         style="background-color: ${highlightColor}; opacity: 0.2;"></div>
                    
                    <div class="size-16 rounded-2xl dark:bg-white/5 light:bg-black/5 border dark:border-white/10 light:border-black/10 flex items-center justify-center shadow-inner group-hover:border-${game.color}/50 transition-colors">
                        <span class="text-4xl">${game.icon}</span>
                    </div>
                    
                    <div class="flex flex-col gap-1 z-10">
                        <h3 class="dark:text-white light:text-charcoal text-xl font-bold group-hover:text-${game.color} transition-colors">${highlightText(game.title)}</h3>
                        <p class="dark:text-gray-400 light:text-slate-text text-sm leading-relaxed">${highlightText(game.description)}</p>
                    </div>
                    
                    <div class="mt-auto flex flex-wrap gap-1">
                        ${game.tags.map(tag => `<span class="category-tag">${highlightText(tag)}</span>`).join('')}
                    </div>
                `;
                
                gamesGrid.appendChild(gameElement);
            });
        }

        function highlightText(text) {
            if (!currentSearch) return text;
            
            const regex = new RegExp(`(${currentSearch})`, 'gi');
            return text.replace(regex, '<span class="search-highlight">$1</span>');
        }

        // Initialize with "全部" button active
        document.querySelector('.category-filter[data-category="all"]').click();
    </script>
</body>
</html>
